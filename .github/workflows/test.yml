name: Verify COMMANDS

on:
  push:
    branches: ["main", "codex/full-stack-mvp"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild deterministic seed packages
        run: npm run seed:packages
      - name: Unit, registry, package, and preview coverage tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

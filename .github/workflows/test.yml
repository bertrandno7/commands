name: Verify COMMANDS

on:
  push:
    branches: ["main", "codex/full-stack-mvp"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild deterministic seed packages
        run: npm run seed:packages
      - name: Unit, registry, package, and preview coverage tests
        run: npm test
      - name: Serve static command previews
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/commands-preview.log 2>&1 &
          sleep 2
      - name: Verify basic-shape defaults and experimental shared geometry
        run: node tests/project-geometry-browser.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

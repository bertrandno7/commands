name: Deploy COMMANDS preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node for automated demo screenshots
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless-browser dependency
        run: npm install --no-package-lock --ignore-scripts

      - name: Start local static site for screenshot capture
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/commands-preview-http.log 2>&1 &
          sleep 2

      - name: Capture real SunHours and WindScreen thumbnails
        run: npm run thumbnails

      - name: Verify generated images
        run: |
          test -s assets/thumbnails/A001.png
          test -s assets/thumbnails/W001.png
          test -s assets/thumbnails/M004.png
          test -s assets/thumbnails/manifest.json

      - name: Stage frontend and demo assets only
        run: |
          mkdir -p _site
          cp index.html styles.css app.js README.md COMMAND_SPEC.md _site/
          cp -R demo assets _site/
          test -s _site/assets/thumbnails/A001.png
          test -s _site/assets/thumbnails/W001.png
          test -s _site/assets/thumbnails/M004.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload clean site with fresh screenshots
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

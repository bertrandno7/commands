name: Deploy COMMANDS preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node for registry and preview capture
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Build command registry from filesystem
        run: npm run registry

      - name: Start local static site for preview capture
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/commands-preview-http.log 2>&1 &
          sleep 2

      - name: Capture every registered live preview
        run: npm run thumbnails

      - name: Verify registry and generated thumbnails
        run: |
          test -s generated/commands.json
          test -s assets/thumbnails/manifest.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("generated/commands.json")); for(const c of r.commands.filter(x=>x.listed!==false&&x.preview?.type==="web")){const p="assets/thumbnails/"+c.id+".png"; if(!fs.existsSync(p)||fs.statSync(p).size<8000) throw new Error("Missing preview "+p)} console.log("verified",r.livePreviewCount,"live thumbnails")'

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js README.md COMMAND_SPEC.md _site/
          cp -R demo assets generated commands _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload clean site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
